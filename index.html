<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>PitchGenius Chatbot Lab</title>
<style>
body { margin: 0; font-family: Manrope, system-ui, sans-serif; background: #0e1828; }
header { display: flex; gap: 8px; align-items: center; padding: 10px 16px; overflow-x: auto; }
header strong { color: #f6f5f1; margin-right: 12px; white-space: nowrap; }
button { border: 1px solid #30b6b9; background: transparent; color: #f6f5f1; border-radius: 12px; padding: 8px 14px; cursor: pointer; white-space: nowrap; }
button[aria-pressed="true"] { background: #30b6b9; color: #001a22; }
iframe { width: 100%; height: calc(100vh - 58px); border: 0; display: block; background: #fbfaf7; }
</style>
</head>
<body>
<header><strong>PitchGenius Chatbot Lab</strong><button data-bot="asyntai">Asyntai</button><button data-bot="botpress">Botpress</button><button data-bot="docsbot">DocsBot</button></header>
<iframe title="Home page with the selected chatbot"></iframe>
<script>
const frame = document.querySelector("iframe");
const buttons = [...document.querySelectorAll("button")];

function show(bot) {
  frame.src = `bots/${bot}.html`;
  buttons.forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.bot === bot)));
  history.replaceState(null, "", `?bot=${bot}`);
}

buttons.forEach((b) => b.addEventListener("click", () => show(b.dataset.bot)));
show(new URLSearchParams(location.search).get("bot") || buttons[0].dataset.bot);
</script>
</body>
</html>
